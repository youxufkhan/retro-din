<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- userSpaceOnUse: each 9-slice piece must show its own slot of one
         continuous gradient, not replay the whole ramp inside its own box -->
    <linearGradient id="metalgrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#4a5457"/>
      <stop offset="0.12" stop-color="#3a4245"/>
      <stop offset="0.5" stop-color="#272d2f"/>
      <stop offset="1" stop-color="#14181a"/>
    </linearGradient>
  </defs>

  <!-- margin hints: 6px safe area on every edge before content may draw -->
  <rect id="hint-top-margin" x="0" y="0" width="1" height="6"/>
  <rect id="hint-bottom-margin" x="0" y="58" width="1" height="6"/>
  <rect id="hint-left-margin" x="0" y="0" width="6" height="1"/>
  <rect id="hint-right-margin" x="58" y="0" width="6" height="1"/>

  <rect id="topleft" x="0" y="0" width="8" height="8" fill="url(#metalgrad)"/>
  <rect id="topright" x="56" y="0" width="8" height="8" fill="url(#metalgrad)"/>
  <rect id="bottomleft" x="0" y="56" width="8" height="8" fill="url(#metalgrad)"/>
  <rect id="bottomright" x="56" y="56" width="8" height="8" fill="url(#metalgrad)"/>

  <rect id="top" x="8" y="0" width="48" height="8" fill="url(#metalgrad)"/>
  <rect id="bottom" x="8" y="56" width="48" height="8" fill="url(#metalgrad)"/>
  <rect id="left" x="0" y="8" width="8" height="48" fill="url(#metalgrad)"/>
  <rect id="right" x="56" y="8" width="8" height="48" fill="url(#metalgrad)"/>

  <!-- center stretches (no hint-tile-center): streaks smear into brushed metal.
       Explicit irregular lines instead of a tiled pattern, so nothing repeats. -->
  <g id="center">
    <rect x="8" y="8" width="48" height="48" fill="url(#metalgrad)"/>
    <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
      <line x1="8" y1="11" x2="56" y2="11"/>
      <line x1="8" y1="19" x2="56" y2="19"/>
      <line x1="8" y1="30" x2="56" y2="30"/>
      <line x1="8" y1="44" x2="56" y2="44"/>
    </g>
    <g stroke="#000000" stroke-opacity="0.11" stroke-width="1">
      <line x1="8" y1="15" x2="56" y2="15"/>
      <line x1="8" y1="24" x2="56" y2="24"/>
      <line x1="8" y1="26" x2="56" y2="26"/>
      <line x1="8" y1="37" x2="56" y2="37"/>
      <line x1="8" y1="50" x2="56" y2="50"/>
    </g>
  </g>
</svg>
