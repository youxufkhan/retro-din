<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- userSpaceOnUse: each 9-slice piece must show its own slot of one
         continuous gradient, not replay the whole ramp inside its own box -->
    <linearGradient id="metalgrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#4a5457"/>
      <stop offset="0.12" stop-color="#3a4245"/>
      <stop offset="0.5" stop-color="#272d2f"/>
      <stop offset="1" stop-color="#14181a"/>
    </linearGradient>
  </defs>

  <!-- margin hints: 6px safe area on every edge before content may draw -->
  <rect id="hint-top-margin" x="0" y="0" width="1" height="6"/>
  <rect id="hint-bottom-margin" x="0" y="58" width="1" height="6"/>
  <rect id="hint-left-margin" x="0" y="0" width="6" height="1"/>
  <rect id="hint-right-margin" x="58" y="0" width="6" height="1"/>

  <rect id="topleft" x="0" y="0" width="8" height="8" fill="url(#metalgrad)"/>
  <rect id="topright" x="56" y="0" width="8" height="8" fill="url(#metalgrad)"/>
  <rect id="bottomleft" x="0" y="56" width="8" height="8" fill="url(#metalgrad)"/>
  <rect id="bottomright" x="56" y="56" width="8" height="8" fill="url(#metalgrad)"/>

  <rect id="top" x="8" y="0" width="48" height="8" fill="url(#metalgrad)"/>
  <rect id="bottom" x="8" y="56" width="48" height="8" fill="url(#metalgrad)"/>
  <rect id="left" x="0" y="8" width="8" height="48" fill="url(#metalgrad)"/>
  <rect id="right" x="56" y="8" width="8" height="48" fill="url(#metalgrad)"/>

  <!-- center stretches (no hint-tile-center): streaks smear into brushed metal.
       Explicit irregular lines instead of a tiled pattern, so nothing repeats. -->
  <g id="center">
    <rect x="8" y="8" width="48" height="48" fill="url(#metalgrad)"/>
    <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="0.6">
      <line x1="8" y1="10" x2="56" y2="10"/>
      <line x1="8" y1="13" x2="56" y2="13"/>
      <line x1="8" y1="17" x2="56" y2="17"/>
      <line x1="8" y1="22" x2="56" y2="22"/>
      <line x1="8" y1="27" x2="56" y2="27"/>
      <line x1="8" y1="31" x2="56" y2="31"/>
      <line x1="8" y1="36" x2="56" y2="36"/>
      <line x1="8" y1="41" x2="56" y2="41"/>
      <line x1="8" y1="46" x2="56" y2="46"/>
      <line x1="8" y1="51" x2="56" y2="51"/>
    </g>
    <g stroke="#000000" stroke-opacity="0.06" stroke-width="0.6">
      <line x1="8" y1="11" x2="56" y2="11"/>
      <line x1="8" y1="15" x2="56" y2="15"/>
      <line x1="8" y1="20" x2="56" y2="20"/>
      <line x1="8" y1="24" x2="56" y2="24"/>
      <line x1="8" y1="29" x2="56" y2="29"/>
      <line x1="8" y1="33" x2="56" y2="33"/>
      <line x1="8" y1="38" x2="56" y2="38"/>
      <line x1="8" y1="43" x2="56" y2="43"/>
      <line x1="8" y1="48" x2="56" y2="48"/>
      <line x1="8" y1="53" x2="56" y2="53"/>
    </g>
  </g>
  <g id="mask-topleft">
    <rect x="0" y="0" width="8" height="8" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-top">
    <rect x="8" y="0" width="48" height="8" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-topright">
    <rect x="56" y="0" width="8" height="8" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-left">
    <rect x="0" y="8" width="8" height="48" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-center">
    <rect x="8" y="8" width="48" height="48" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-right">
    <rect x="56" y="8" width="8" height="48" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-bottomleft">
    <rect x="0" y="56" width="8" height="8" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-bottom">
    <rect x="8" y="56" width="48" height="8" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="mask-bottomright">
    <rect x="56" y="56" width="8" height="8" fill="#ffffff" fill-opacity="1"/>
  </g>
  <g id="shadow-topleft">
    <rect x="0" y="0" width="8" height="8" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-top">
    <rect x="8" y="0" width="48" height="8" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-topright">
    <rect x="56" y="0" width="8" height="8" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-left">
    <rect x="0" y="8" width="8" height="48" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-center">
    <rect x="8" y="8" width="48" height="48" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-right">
    <rect x="56" y="8" width="8" height="48" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-bottomleft">
    <rect x="0" y="56" width="8" height="8" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-bottom">
    <rect x="8" y="56" width="48" height="8" fill="#000000" fill-opacity="0.3"/>
  </g>
  <g id="shadow-bottomright">
    <rect x="56" y="56" width="8" height="8" fill="#000000" fill-opacity="0.3"/>
  </g>
  <rect id="sb" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="sl" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="sr" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="st" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="shadow-corner" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="shadow-side" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="shadow-bottomright-9" x="0" y="0" width="2" height="2" fill="none" fill-opacity="0"/>
  <rect id="thick-center" x="8" y="8" width="48" height="48" fill="url(#metalgrad)"/>
</svg>
