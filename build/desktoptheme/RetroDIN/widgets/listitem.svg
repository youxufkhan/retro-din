  <rect id="section-hint-bottom-margin" x="0" y="0" width="1" height="1"/>
  <rect id="section-hint-left-margin" x="0" y="0" width="1" height="1"/>
  <rect id="section-hint-right-margin" x="0" y="0" width="1" height="1"/>
