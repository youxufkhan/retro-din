  <g id="active-left"><rect x="0" y="28" width="6" height="10" fill="#3a2f1c"/><rect x="0" y="28" width="6" height="1.5" fill="#ffb454"/><rect x="0" y="36.5" width="6" height="1.5" fill="#ffb454"/></g>
