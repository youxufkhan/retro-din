  <g id="inactive-left"><rect x="0" y="6" width="6" height="10" fill="#001210"/><rect x="0" y="6" width="6" height="1.5" fill="#0a2e29"/><rect x="0" y="14.5" width="6" height="1.5" fill="#0a2e29"/></g>
