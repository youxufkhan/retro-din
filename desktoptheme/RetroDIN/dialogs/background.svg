<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <pattern id="wellscan" width="1" height="2" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#001210"/>
      <rect width="1" height="1" fill="#000000" opacity="0.25"/>
    </pattern>
  </defs>
  <rect id="hint-top-margin" x="0" y="0" width="1" height="8"/>
  <rect id="hint-bottom-margin" x="0" y="40" width="1" height="8"/>
  <rect id="hint-left-margin" x="0" y="0" width="8" height="1"/>
  <rect id="hint-right-margin" x="40" y="0" width="8" height="1"/>
  <rect id="hint-tile-center" x="0" y="0" width="1" height="1"/>
  <g id="topleft">
    <rect x="0" y="0" width="8" height="8" fill="#001210"/>
    <rect x="0" y="0" width="8" height="1" fill="#0a2e29"/>
    <rect x="0" y="0" width="1" height="8" fill="#0a2e29"/>
  </g>
  <g id="top">
    <rect x="8" y="0" width="32" height="8" fill="#001210"/>
    <rect x="8" y="0" width="32" height="1" fill="#0a2e29"/>
  </g>
  <g id="topright">
    <rect x="40" y="0" width="8" height="8" fill="#001210"/>
    <rect x="40" y="0" width="8" height="1" fill="#0a2e29"/>
    <rect x="47" y="0" width="1" height="8" fill="#0a2e29"/>
  </g>
  <g id="left">
    <rect x="0" y="8" width="8" height="32" fill="#001210"/>
    <rect x="0" y="8" width="1" height="32" fill="#0a2e29"/>
  </g>
  <g id="center">
    <rect x="8" y="8" width="32" height="32" fill="url(#wellscan)"/>
  </g>
  <g id="right">
    <rect x="40" y="8" width="8" height="32" fill="#001210"/>
    <rect x="47" y="8" width="1" height="32" fill="#0a2e29"/>
  </g>
  <g id="bottomleft">
    <rect x="0" y="40" width="8" height="8" fill="#001210"/>
    <rect x="0" y="47" width="8" height="1" fill="#0a2e29"/>
    <rect x="0" y="40" width="1" height="8" fill="#0a2e29"/>
  </g>
  <g id="bottom">
    <rect x="8" y="40" width="32" height="8" fill="#001210"/>
    <rect x="8" y="47" width="32" height="1" fill="#0a2e29"/>
  </g>
  <g id="bottomright">
    <rect x="40" y="40" width="8" height="8" fill="#001210"/>
    <rect x="40" y="47" width="8" height="1" fill="#0a2e29"/>
    <rect x="47" y="40" width="1" height="8" fill="#0a2e29"/>
  </g>
</svg>
